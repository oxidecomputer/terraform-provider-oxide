[[features]]
title = "`oxide_ip_pool_silo_link`"
description = "The `id` attribute for the `oxide_ip_pool_silo_link` resource now uses the format `IP_POOL_ID/SILO_ID`, matching the `oxide_subnet_pool_silo_link` resource. [#794](https://github.com/oxidecomputer/terraform-provider-oxide/pull/794)"

[[enhancements]]
title = "Validate UUID Attributes"
description = "Attributes that expect UUIDs now validate whether their values are, in fact, valid UUIDs. This catches cases where names passed to attributes expecting UUIDs accidentally worked. [#795](https://github.com/oxidecomputer/terraform-provider-oxide/pull/795)."

[[enhancements]]
title = "`oxide_switch_port_settings`"
description = "The `md5_auth_key` attribute is now configured to be sensitive. [#808](https://github.com/oxidecomputer/terraform-provider-oxide/pull/808)."

[[bugs]]
title = "`oxide_ip_pool_silo_link`"
description = "The `silo_id` attribute now resolves to the silo's UUID, even if the attribute was previously configured by name. [#795](https://github.com/oxidecomputer/terraform-provider-oxide/pull/795)."

[[bugs]]
title = "`oxide_subnet_pool_silo_link`"
description = "The `silo_id` attribute now resolves to the silo's UUID, even if the attribute was previously configured by name. [#795](https://github.com/oxidecomputer/terraform-provider-oxide/pull/795)."

[[bugs]]
title = "`oxide_system_ip_pools`"
description = "The `oxide_system_ip_pools` data source now uses the `system_ip_pool_list` API, allowing it to read all the IP pools for the system.. [#807](https://github.com/oxidecomputer/terraform-provider-oxide/pull/807)."

[[bugs]]
title = "`oxide_silo`"
description = "The `tls_certificates[].key` attribute is now marked sensitive and its cleartext value no longer logged in debug mode, resolving [Oxide Security Advisory 20260804-1](https://docs.oxide.computer/security/advisories/20260804-1). [#810](https://github.com/oxidecomputer/terraform-provider-oxide/pull/810)"
